name: Verify Android shell

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "mobile/**"
      - "scripts/build-mobile.mjs"
      - "scripts/set-android-version.mjs"
      - ".github/workflows/android-verify.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/publish-mobile-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build mobile web bundle
        env:
          MOBILE_WEB_VERSION: "1.0.0"
          NATIVE_VERSION: "1.0.0"
        run: npm run build:mobile
      - name: Verify OTA bundle packaging
        run: |
          npx @capgo/cli@8.68.0 bundle zip com.alexaxel.engforever \
            --path ./www \
            --bundle 1.0.0 \
            --name eng-forever-ota-verify.zip \
            --no-code-check
          test -f eng-forever-ota-verify.zip
      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Set Android version
        run: npm run android:version -- 1.0.0 "${{ github.run_number }}"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify release APK/AAB signing pipeline with an ephemeral CI key
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/verify.keystore" -storepass verify-only-password -keypass verify-only-password -alias verify -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Verify"
          (cd android && ./gradlew assembleRelease bundleRelease --stacktrace)
          mkdir -p "$RUNNER_TEMP/release-verify"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/release-verify/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/verify.keystore" --ks-type PKCS12 --ks-key-alias verify --ks-pass pass:verify-only-password --key-pass pass:verify-only-password --out "$RUNNER_TEMP/release-verify/EngForever.apk" "$RUNNER_TEMP/release-verify/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/release-verify/EngForever.apk"
          jarsigner -keystore "$RUNNER_TEMP/verify.keystore" -storetype PKCS12 -storepass verify-only-password -keypass verify-only-password -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$RUNNER_TEMP/release-verify/EngForever.aab" android/app/build/outputs/bundle/release/app-release.aab verify
          jarsigner -verify "$RUNNER_TEMP/release-verify/EngForever.aab" >/dev/null
      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: eng-forever-android-debug-verification
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
