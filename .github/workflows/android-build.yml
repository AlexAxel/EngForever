name: Build Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Native/mobile version (semver, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      publish_release:
        description: "Also publish APK/AAB as a GitHub Release"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Optional release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate signing configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          node -e 'if(!/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(process.env.VERSION_NAME)) process.exit(1)'
      - name: Prepare monotonically increasing Android version code
        run: |
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build bundled web app
        env:
          MOBILE_WEB_VERSION: ${{ inputs.version_name }}
          NATIVE_VERSION: ${{ inputs.version_name }}
        run: npm run build:mobile
      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:version -- "$VERSION_NAME" "$VERSION_CODE"
      - name: Decode release signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/engforever-release.keystore"
          chmod 600 "$RUNNER_TEMP/engforever-release.keystore"
      - name: Build unsigned release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Sign APK and AAB
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_IN="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="$RUNNER_TEMP/engforever-aligned.apk"
          APK_OUT="dist/EngForever-$VERSION_NAME.apk"
          AAB_IN="android/app/build/outputs/bundle/release/app-release.aab"
          AAB_OUT="dist/EngForever-$VERSION_NAME.aab"

          test -f "$APK_IN"
          test -f "$AAB_IN"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/engforever-release.keystore"             --ks-type PKCS12             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$APK_OUT"             "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_OUT"

          jarsigner             -keystore "$RUNNER_TEMP/engforever-release.keystore"             -storetype PKCS12             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             -sigalg SHA256withRSA             -digestalg SHA-256             -signedjar "$AAB_OUT"             "$AAB_IN"             "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB_OUT" >/dev/null

          sha256sum "$APK_OUT" "$AAB_OUT" > dist/SHA256SUMS.txt
      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eng-forever-android-${{ inputs.version_name }}
          path: dist/*
          retention-days: 30
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="android-v$VERSION_NAME"
          TITLE="Eng Forever Android $VERSION_NAME"
          NOTES="$RELEASE_NOTES"
          if [ -z "$NOTES" ]; then NOTES="Signed APK and Google Play AAB for Eng Forever $VERSION_NAME."; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes "$NOTES"
          fi
