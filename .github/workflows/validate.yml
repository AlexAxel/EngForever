name: Validate Eng Forever
on:
  push:
    branches: [main, design/open-design-mobile]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate phrase catalogue
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cards=JSON.parse(fs.readFileSync('data/phrases.json','utf8'));
          assert.ok(cards.length>=120,'Expected notebook pairs 1–120');
          assert.equal(new Set(cards.map(p=>p.id)).size,cards.length);
          for(let id=1;id<=cards.length;id++){
            const p=cards.find(p=>p.id===id);
            assert.ok(p&&typeof p.ru==='string'&&p.ru.trim()&&typeof p.eng==='string'&&p.eng.trim(),'Invalid phrase #'+id);
          }
          console.log('Validated '+cards.length+' unique, complete pairs; all source IDs 1 through catalogue length present');
          NODE
  mobile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser test runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve app and verify mobile interactions
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/eng-forever-server.log 2>&1 &
          node tests/smoke.mjs
          node tests/catalog-growth.mjs
          node tests/rounds.mjs
          node tests/catalog-120.mjs
          node tests/design-mobile.mjs
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eng-forever-design-screenshots
          path: test-output/*.png
          if-no-files-found: ignore
